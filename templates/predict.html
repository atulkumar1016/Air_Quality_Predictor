<!DOCTYPE html>
<html>
<head>
    <title>AQI Predictor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

<style>
    body { 
        margin: 0;
        padding: 0;
        font-family: 'Poppins', sans-serif;
        background: radial-gradient(circle at top, #09121a, #000000);
        color: white;
        overflow-x: hidden;
        text-align: center;
        padding: 40px;
    }

    /* Glow Grid Background Animation */
    body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: url("https://www.transparenttextures.com/patterns/cubes.png");
        opacity: 0.08;
        animation: fade 5s linear infinite alternate;
        pointer-events: none;
    }
    @keyframes fade {
        0% {opacity: .03;}
        100% {opacity: .10;}
    }

    .box {
        margin: auto;
        max-width: 650px;
        background: rgba(255,255,255,0.06);
        padding: 50px;
        border-radius: 30px;
        backdrop-filter: blur(18px);
        border: 1px solid rgba(255,255,255,0.15);
        box-shadow: 0 0 40px rgba(0,255,255,0.15);
        animation: slide 0.8s ease;
    }

    @keyframes slide {
        from { transform: translateY(70px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }

    h1 {
        font-size: 3rem;
        margin-bottom: 30px;
        background: linear-gradient(90deg, #00f5ff, #ff00ff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 0 20px rgba(0,245,255,0.4);
    }

    .input-group {
        margin: 25px 0;
        text-align: left;
        background: rgba(255,255,255,0.07);
        padding: 18px 20px;
        border-radius: 18px;
        border-left: 4px solid #00f5ff;
        transition: 0.3s;
    }

    .input-group:hover {
        transform: translateX(8px);
        background: rgba(255,255,255,0.12);
        border-left: 4px solid #ff00ff;
    }

    .input-group label {
        font-size: 1.25rem;
        font-weight: 600;
    }

    .range {
        float: right;
        font-size: 0.85rem;
        color: #00f5ff;
    }

    input {
        width: 100%;
        padding: 16px;
        margin-top: 12px;
        border-radius: 12px;
        background: rgba(255,255,255,0.14);
        border: none;
        color: white;
        font-size: 1.1rem;
    }

    input::placeholder {
        color: #aceeff;
    }

    button {
        margin-top: 25px;
        padding: 18px 60px;
        background: linear-gradient(90deg, #00f5ff, #ff00ff);
        color: black;
        border: none;
        border-radius: 50px;
        font-size: 1.4rem;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
        box-shadow: 0 0 20px rgba(0,245,255,0.4);
    }

    button:hover {
        transform: translateY(-8px) scale(1.05);
        box-shadow: 0 0 35px rgba(255,0,255,0.6);
    }

    .result {
        margin-top: 45px;
        padding: 35px;
        border-radius: 25px;
        font-size: 2rem;
        animation: pop 0.5s;
        border: 4px solid;
    }

    @keyframes pop {
        from { transform: scale(0.4); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
    }

    .good { border-color: #00e400; background: #00330088; }
    .moderate { border-color: yellow; background: #33330088; }
    .unhealthy-sensitive { border-color: orange; background: #33220088; }
    .unhealthy { border-color: red; background: #33000088; }
    .very-unhealthy { border-color: purple; background: #22002288; }
    .hazardous { border-color: maroon; background: #330011cc; }

    a {
        color:#00f5ff; 
        font-size:1.3rem; 
        text-decoration:none;
    }

    a:hover {
        text-shadow: 0 0 10px cyan;
    }
</style>

</head>
<body>

    <div class="box">
        <h1>AQI Predictor</h1>

        <form method="post">

            <div class="input-group">
                <label>PM2.5</label><span class="range">0 - 500</span>
                <input type="number" step="0.01" name="PM2_5" placeholder="Enter PM2.5" required>
            </div>

            <div class="input-group">
                <label>PM10</label><span class="range">0 - 1000</span>
                <input type="number" step="0.01" name="PM10" placeholder="Enter PM10" required>
            </div>

            <div class="input-group">
                <label>NO₂</label><span class="range">0 - 300</span>
                <input type="number" step="0.01" name="NO2" placeholder="Enter NO₂" required>
            </div>

            <div class="input-group">
                <label>SO₂</label><span class="range">0 - 300</span>
                <input type="number" step="0.01" name="SO2" placeholder="Enter SO₂" required>
            </div>

            <button type="submit">Predict AQI</button>
        </form>

        {% if error %}
            <p style="color:red; margin-top:20px;">{{ error }}</p>
        {% endif %}

        {% if show %}
            <div class="result {{ color }}">
                <h2>{{ aqi }}</h2>
                <h3>{{ category }}</h3>
                <p style="font-size:1.4rem;">{{ message }}</p>
            </div>
        {% endif %}

        <br><br>
        <a href="/">← Back to Home</a>
    </div>

</body>
</html>
